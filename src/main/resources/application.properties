spring.application.name=exercise-counter
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
server.port=8090
# Only reachable via nginx on the same host (override with SERVER_ADDRESS=0.0.0.0 if needed)
server.address=127.0.0.1

# Origins allowed to call the API with cookies (comma separated). Override per environment,
# e.g. APP_CORS_ALLOWED_ORIGINS=https://exercise-counter.de
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:80,http://192.168.178.52:80,http://192.168.178.52:8080,https://exercise-counter.de

# Reminders by push notification. Off without keys – the log shows a fresh key pair at startup.
# Set APP_PUSH_PUBLIC_KEY / APP_PUSH_PRIVATE_KEY once and keep them (new keys invalidate all subscriptions).
app.push.public-key=${APP_PUSH_PUBLIC_KEY:}
app.push.private-key=${APP_PUSH_PRIVATE_KEY:}
app.push.subject=${APP_PUSH_SUBJECT:https://exercise-counter.de}

# Usernames that may create password reset links (comma separated), e.g. APP_ADMINS=leon
app.admins=${APP_ADMINS:}

# Login: ends after this idle time. The open app checks the session every 30 seconds, so it only counts while
# the app is closed or in the background.
server.servlet.session.timeout=2h
# The session cookie is not sent by other sites
server.servlet.session.cookie.same-site=lax
# Set APP_SECURE_COOKIES=true where the app is reached by https only (production)
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:false}

# videos and photos of steps: off without a directory (see MediaProperties for all settings)
app.media.dir=${APP_MEDIA_DIR:}
app.media.ffmpeg=${APP_MEDIA_FFMPEG:ffmpeg}
app.media.ffprobe=${APP_MEDIA_FFPROBE:ffprobe}
app.media.video-encoder=${APP_MEDIA_ENCODER:libx264}
spring.servlet.multipart.max-file-size=90MB
spring.servlet.multipart.max-request-size=91MB
