spring.application.name=exercise-counter
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
server.port=8090

# Origins allowed to call the API with cookies (comma separated). Override per environment,
# e.g. APP_CORS_ALLOWED_ORIGINS=https://exercise-counter.de
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:80,http://192.168.178.52:80,http://192.168.178.52:8080,https://exercise-counter.de

# Reminders by push notification. Off without keys – the log shows a fresh key pair at startup.
# Set APP_PUSH_PUBLIC_KEY / APP_PUSH_PRIVATE_KEY once and keep them (new keys invalidate all subscriptions).
app.push.public-key=${APP_PUSH_PUBLIC_KEY:}
app.push.private-key=${APP_PUSH_PRIVATE_KEY:}
app.push.subject=${APP_PUSH_SUBJECT:https://exercise-counter.de}

# Usernames that may create password reset links (comma separated), e.g. APP_ADMINS=leon
app.admins=${APP_ADMINS:}
